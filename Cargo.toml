[package]
name = "iciaws-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Scaffolding tool for AWS serverless API projects using the iciaws library"
repository = "https://github.com/intercci/iciaws-cli"
readme = "README.md"

[dependencies]
anyhow = "1.0"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
indicatif = "0.17"
tempfile = "3.20"
regex = "1.12"

[build-dependencies]
walkdir = "2.5"
